<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillMap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F3F6FA;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            color: #173B68;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            text-align: center;
            color: #64748B;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #173B68;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748B;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #173B68;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #D8E0EA;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3478F6;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3478F6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2464D8;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748B;
        }

        .signup a {
            color: #3478F6;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            color: #DC2626;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="logo">SkillMap</div>

        <p class="tagline">
            Your Skills. Your Goals. Your Growth.
        </p>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to continue your learning journey.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label>Username or Email</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username or email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Log In</button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign Up</a>
        </p>

    </div>

</body>
</html>
