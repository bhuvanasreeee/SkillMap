<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Goal - SkillMap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="main-content" style="margin-left:0;">

    <header>
        <div>
            <h1>Edit Learning Goal</h1>
            <p>Update your goal details and learning progress.</p>
        </div>

        <a href="/goals" class="profile">Back to Goals</a>
    </header>

    <div class="panel">

        <h2>Update Goal</h2>

        <form action="/edit_goal/{{ goal.id }}" method="POST">

            <label>Goal Title</label>
            <input type="text" name="title"
                   value="{{ goal.title }}" required>

            <label>Description</label>
            <textarea name="description">{{ goal.description or "" }}</textarea>

            <label>Target Date</label>
            <input type="date" name="target_date"
                   value="{{ goal.target_date }}" required>

            <label>Progress (%)</label>
            <input type="number" name="progress"
                   min="0" max="100"
                   value="{{ goal.progress }}" required>

            <button type="submit">Save Changes</button>

        </form>

    </div>

</div>

</body>
</html>
